logging.level.com.example.exceptions=OFF
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false
spring.cache.type=none

spring.rabbitmq.addresses=amqp://guest:guest@localhost:5672
spring.rabbitmq.ssl.enabled=false
spring.rabbitmq.connection-timeout=1000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.mail.enabled=false

app.frontend-url=http://localhost:3000
app.scheduling.enabled=false
jwt.secret=testSecretKeyForTestingOnly1234567890abcdefghijklmnop